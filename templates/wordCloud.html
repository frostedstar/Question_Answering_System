{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/wordCloud.css' %}">
{% endblock %}
{% block title %}动态词云{% endblock %}

{% block content %}

  <div id="wordcloud-container"></div>
  <div id="tooltip"></div>

  <!-- WordCloud2 库 -->
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
  <script>
    const container = document.getElementById('wordcloud-container');
    const tooltip = document.getElementById('tooltip');

    const userId = "{{ userId }}";

    function fadeIn(element, duration=600) {
      element.style.opacity = 0;
      element.style.transition = `opacity ${duration}ms ease-in-out`;
      void element.offsetWidth;
      element.style.opacity = 1;
    }

    function generateWordCloud(data) {
      container.innerHTML = '';
      container.style.opacity = 0;

      // ===== 动态调整参数 =====
      const wordCount = data.length;
      const maxValue = Math.max(...data.map(d => d[1]));

      // 数据量越大 gridSize 越小，最多 20 最少 4
      const gridSize = Math.max(10, Math.min(35, 60 - wordCount));

      // 权重因子：根据最大值缩放，防止字太小或太大
      const weightFactor = (size) => {
        // 这里的 80 是最大字体像素，可根据需要调整
        return (size / maxValue) * 160;
      };

      
      // 蓝色调
      function getBlueShade() {
        const blue = 180 + Math.floor(Math.random() * 75); // 180~255
        const green = Math.floor(Math.random() * 120);     // 0~120
        const red = Math.floor(Math.random() * 80);        // 0~80
        return `rgb(${red}, ${green}, ${blue})`;
      }

      // 暖色调（红橙黄）
      function getWarmShade() {
        const red = 200 + Math.floor(Math.random() * 55);  // 200~255
        const green = 80 + Math.floor(Math.random() * 150); // 80~230
        const blue = Math.floor(Math.random() * 50);       // 0~50
        return `rgb(${red}, ${green}, ${blue})`;
      }

      // 绿色系
      function getGreenShade() {
        const green = 150 + Math.floor(Math.random() * 105); // 150~255
        const red = Math.floor(Math.random() * 120);         // 0~120
        const blue = Math.floor(Math.random() * 100);        // 0~100
        return `rgb(${red}, ${green}, ${blue})`;
      }

      function randomColor(){
        const type = Math.floor(Math.random() * 3) + 1
          if (type === 1) return getBlueShade();
          if (type === 2) return getWarmShade();
          return getGreenShade();
      }


      
      WordCloud(container, {
        list: data,
        gridSize: gridSize,
        weightFactor: weightFactor,
        fontFamily: 'Arial, sans-serif',
        color: randomColor,
        backgroundColor: '#fff',
        rotateRatio: 0,
        rotationSteps: 2,
        shuffle: true,
        shape: 'circle',
        ellipticity: 0.65,
        mouseout: function() {
          tooltip.style.display = 'none';
        },
      });

      setTimeout(() => fadeIn(container, 600), 50);
    }

    fetch(`/wordCloudData/${userId}/`)
      .then(response => response.json())
      .then(data => {
        const listData = data.map(item => [item.name, item.value]);
        generateWordCloud(listData);
      })
      .catch(err => {
        console.error("词云数据加载失败：", err);
      });
  </script>

{% endblock %}
